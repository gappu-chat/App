<!DOCTYPE html>
<html lang="hi" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gappu Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="w" id="auth">
  <h1>Gappu Chat</h1>
  <p class="sub">🎉 Free Chat • Free Games • Zero Paisa</p>
  <input id="email" type="email" placeholder="Email">
  <input id="pass" type="password" placeholder="Password">
  <button id="go">Login</button>
  <button id="guestBtn" class="alt">👤 Guest ban ke khelo</button>
</div>

<div class="w hidden" id="app">
  <div id="vChats">
    <h2 style="color:var(--acc);">Chats</h2>
    <input id="q" placeholder="User ID search karo">
    <div id="results"></div>
    <div id="list"></div>
  </div>
  <div id="vGames" class="hidden">
    <h2 style="color:var(--acc);">Games</h2>
    <p class="dim">Coming soon...</p>
  </div>
  <div id="vMe" class="hidden">
    <h2 style="color:var(--acc);">Profile</h2>
    <p class="dim">Coming soon...</p>
  </div>
  <nav>
    <button id="nChats" class="on">💬 Chats</button>
    <button id="nGames">🎮 Games</button>
    <button id="nMe">👤 Profile</button>
  </nav>
</div>

<div id="chat" class="hidden">
  <div class="ch">
    <button id="back" class="ic alt">←</button>
    <div class="av" id="chAv"></div>
    <b id="chName"></b>
  </div>
  <div id="msgs"></div>
  <div class="bar">
    <input id="txt" placeholder="Message likho..." maxlength="1000">
    <button id="send" class="ic">➤</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase_config.js"></script>
<script src="app.js"></script>
</body>
</html>
