<!DOCTYPE html>
<html lang="hi" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gappu Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="w" id="auth">
  <h1>Gappu Chat</h1>
  <p class="sub">🎉 Free Chat • Free Games</p>
  <input id="email" type="email" placeholder="Email">
  <input id="pass" type="password" placeholder="Password">
  <button id="go">Login</button>
  <button id="guestBtn" class="alt">Guest Login</button>
</div>
<div class="w hidden" id="app">
  <h2>Chats</h2>
  <p>Naya Professional Structure Ready!</p>
  <nav>
    <button id="nChats" class="on">Chats</button>
    <button id="nGames">Games</button>
    <button id="nMe">Profile</button>
  </nav>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase_config.js"></script>
</body>
</html>
