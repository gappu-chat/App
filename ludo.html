<!DOCTYPE html>
<html lang="hi" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Real Ludo</title>
<style>
body{margin:0;background:#0d2b2a;color:#fff;font-family:Georgia,serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow:hidden;}
.header{width:100%;max-width:500px;display:flex;justify-content:space-between;padding:10px;box-sizing:border-box;background:#0a2322;border-bottom:2px solid #e0b04a;z-index:10;}
a{color:#e0b04a;text-decoration:none;font-weight:bold;}
.container{width:100%;max-width:500px;padding:10px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;}

/* Ludo Board Styling */
.board-wrapper{width:100%;aspect-ratio:1;background:#fff;border:4px solid #333;border-radius:8px;position:relative;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);box-shadow:0 10px 30px #0008;overflow:hidden;}
.cell{border:1px solid #ccc;position:relative;display:flex;align-items:center;justify-content:center;}
.cell.safe::before{content:'★';color:#aaa;font-size:14px;}

/* Home Bases */
.home{position:absolute;width:40%;height:40%;display:flex;align-items:center;justify-content:center;border-radius:8px;}
.home.red{top:0;left:0;background:#ff4d4d;}
.home.green{top:0;right:0;background:#2ecc71;}
.home.yellow{bottom:0;right:0;background:#f1c40f;}
.home.blue{bottom:0;left:0;background:#3498db;}
.home-inner{width:70%;height:70%;background:#fff;border-radius:8px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;padding:10px;box-sizing:border-box;}

/* Center Triangle */
.center-triangle{position:absolute;top:40%;left:40%;width:20%;height:20%;background:#333;clip-path:polygon(0 0, 100% 0, 50% 50%);}
.center-triangle.bottom{clip-path:polygon(0 100%, 100% 100%, 50% 50%);}
.center-triangle.left{clip-path:polygon(0 0, 0 100%, 50% 50%);}
.center-triangle.right{clip-path:polygon(100% 0, 100% 100%, 50% 50%);}
.center-box{position:absolute;top:40%;left:40%;width:20%;height:20%;background:#333;z-index:2;display:flex;align-items:center;justify-content:center;}

/* Path Cells Colors */
.path-red{background:#ff4d4d;}
.path-green{background:#2ecc71;}
.path-yellow{background:#f1c40f;}
.path-blue{background:#3498db;}

/* Dice Area */
.dice-area{width:100%;max-width:500px;display:flex;justify-content:space-between;align-items:center;padding:15px;background:#0a2322;border-top:2px solid #e0b04a;box-sizing:border-box;}
.dice{width:50px;height:50px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;color:#333;box-shadow:0 4px 10px #0005;cursor:pointer;}
.roll-btn{background:#e0b04a;color:#000;border:none;padding:10px 20px;border-radius:10px;font-weight:bold;font-size:1rem;cursor:pointer;}

/* Ludo Tokens (Gotiyan) */
.token{width:70%;height:70%;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 5px #0005;position:absolute;transition:all 0.3s;z-index:5;}

</style>
</head>
<body>
<div class="header">
  <a href="index.html">← Wapas</a>
  <div style="font-weight:bold;color:#e0b04a;">Ludo Game</div>
</div>

<div class="container">
  <div class="board-wrapper" id="board">
    <!-- Homes -->
    <div class="home red" id="home-red"><div class="home-inner"><div id="r1"></div><div id="r2"></div><div id="r3"></div><div id="r4"></div></div></div>
    <div class="home green" id="home-green"><div class="home-inner"><div id="g1"></div><div id="g2"></div><div id="g3"></div><div id="g4"></div></div></div>
    <div class="home yellow" id="home-yellow"><div class="home-inner"><div id="y1"></div><div id="y2"></div><div id="y3"></div><div id="y4"></div></div></div>
    <div class="home blue" id="home-blue"><div class="home-inner"><div id="b1"></div><div id="b2"></div><div id="b3"></div><div id="b4"></div></div></div>
    
    <!-- Center -->
    <div class="center-triangle" style="background:#2ecc71;"></div>
    <div class="center-triangle bottom" style="background:#3498db;"></div>
    <div class="center-triangle left" style="background:#ff4d4d;"></div>
    <div class="center-triangle right" style="background:#f1c40f;"></div>
    <div class="center-box"></div>
  </div>
</div>

<div class="dice-area">
  <div style="font-weight:bold;">Turn: <span style="color:#e0b04a;">Waiting...</span></div>
  <div style="display:flex;gap:15px;align-items:center;">
    <div class="dice" id="dice">🎲</div>
    <button class="roll-btn" id="rollBtn">Roll</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDFmI6YZIp7qKbgrgdr8VPLr1xkOXbGHb0",
  authDomain: "auction-game-80e14.firebaseapp.com",
  databaseURL: "https://auction-game-80e14-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "auction-game-80e14",
  appId: "1:984901985057:web:8a5d78169ad75f72341460"
};
firebase.initializeApp(firebaseConfig);
firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);
const db = firebase.database();

// Wait for Firebase to load and generate the 15x15 Path Grid
window.onload = () => {
  generateBoardGrid();
};

function generateBoardGrid() {
  const board = document.getElementById('board');
  
  // We need a custom layout for the 15x15 grid
  // Ludo path cells locations (Row, Col)
  // We will generate the visual grid first. 
  // The homes and center are absolutely positioned on top.
  
  // We only need to draw the path cells in the cross shape.
  for(let r=0; r<15; r++) {
    for(let c=0; c<15; c++) {
      // Skip the 4 homes (6x6 areas)
      if((r<6 && c<6) || (r<6 && c>8) || (r>8 && c<6) || (r>8 && c>8)) continue;
      // Skip the center (3x3 area)
      if(r>=6 && r<=8 && c>=6 && c<=8) continue;

      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = `cell-${r}-${c}`;
      
      // Color specific path cells
      // Red Home Path
      if(r===7 && c>0 && c<6) { cell.classList.add('path-red'); cell.classList.add('safe'); }
      // Red Start (Safe)
      if(r===6 && c===1) { cell.classList.add('path-red'); cell.classList.add('safe'); }

      // Green Home Path
      if(c===7 && r>0 && r<6) { cell.classList.add('path-green'); cell.classList.add('safe'); }
      // Green Start (Safe)
      if(r===1 && c===8) { cell.classList.add('path-green'); cell.classList.add('safe'); }
      
      // Yellow Home Path
      if(r===7 && c>8 && c<14) { cell.classList.add('path-yellow'); cell.classList.add('safe'); }
      // Yellow Start
      if(r===8 && c===13) { cell.classList.add('path-yellow'); cell.classList.add('safe'); }

      // Blue Home Path
      if(c===7 && r>8 && r<14) { cell.classList.add('path-blue'); cell.classList.add('safe'); }
      // Blue Start
      if(r===13 && c===6) { cell.classList.add('path-blue'); cell.classList.add('safe'); }

      // Add generic safe stars
      if((r===2&&c===6) || (r===6&&c===12) || (r===12&&c===8) || (r===8&&c===2)) {
        cell.classList.add('safe');
      }

      board.appendChild(cell);
    }
  }
  
  // Place dummy tokens in homes
  placeToken('r1', 'red', 0);
  placeToken('g1', 'green', 1);
  placeToken('y1', 'yellow', 2);
  placeToken('b1', 'blue', 3);
}

function placeToken(containerId, color, playerIdx) {
  const container = document.getElementById(containerId);
  if(!container) return;
  const t = document.createElement('div');
  t.className = 'token';
  t.style.position = 'relative'; // inside home grid
  if(color === 'red') t.style.background = '#ff4d4d';
  if(color === 'green') t.style.background = '#2ecc71';
  if(color === 'yellow') t.style.background = '#f1c40f';
  if(color === 'blue') t.style.background = '#3498db';
  container.appendChild(t);
}
</script>
</body>
</html>
