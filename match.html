<!DOCTYPE html>
<html lang="hi" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Match</title>
<style>
body{margin:0;background:#0d2b2a;color:#fff;font-family:Georgia,serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
.header{width:100%;max-width:500px;display:flex;justify-content:space-between;padding:10px;box-sizing:border-box}
a{color:#e0b04a;text-decoration:none;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(4, 1fr);gap:10px;max-width:400px;width:90%;margin-top:20px}
.card{aspect-ratio:1;background:#14504d;border:2px solid #2a7a73;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:2rem;cursor:pointer;transition:0.3s;user-select:none}
.card.flipped{background:#e0b04a;color:#1b1b14}
.card.matched{background:#2ecc71;border-color:#27ae60;cursor:default}
.msg{font-size:1.2rem;margin-top:20px;color:#e0b04a;font-weight:bold;text-align:center}
</style>
</head>
<body>
<div class="header">
  <a href="index.html">← Chat par wapas</a>
  <div style="font-weight:bold;color:#e0b04a;">Card Match</div>
</div>
<div class="grid" id="grid"></div>
<div class="msg" id="msg"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDFmI6YZIp7qKbgrgdr8VPLr1xkOXbGHb0",
  authDomain: "auction-game-80e14.firebaseapp.com",
  databaseURL: "https://auction-game-80e14-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "auction-game-80e14",
  appId: "1:984901985057:web:8a5d78169ad75f72341460"
};
firebase.initializeApp(firebaseConfig);
firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);

const emojis = ['🍎','🍌','🍇','🍓','🍒','🍑','🍉','🍍'];
let cards = [];
let flipped = [];
let matched = 0;
let lock = false;
let moves = 0;
let timer = 0;
let timerInterval = null;

function shuffle(a) { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function initGame() {
  cards = shuffle([...emojis, ...emojis]);
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  flipped = []; matched = 0; lock = false; moves = 0;
  document.getElementById('msg').textContent = 'Start matching!';
  
  cards.forEach((emoji, index) => {
    const div = document.createElement('div');
    div.className = 'card';
    div.dataset.index = index;
    div.dataset.emoji = emoji;
    div.textContent = '?';
    div.onclick = () => flipCard(div);
    grid.appendChild(div);
  });
}

function flipCard(div) {
  if (lock || div.classList.contains('flipped') || div.classList.contains('matched')) return;
  
  div.textContent = div.dataset.emoji;
  div.classList.add('flipped');
  flipped.push(div);
  
  if (flipped.length === 2) {
    moves++;
    lock = true;
    if (flipped[0].dataset.emoji === flipped[1].dataset.emoji) {
      flipped[0].classList.add('matched'); flipped[1].classList.add('matched');
      flipped = []; lock = false; matched++;
      if (matched === 8) document.getElementById('msg').textContent = `🏆 Jeet gaye! Total moves: ${moves}`;
    } else {
      setTimeout(() => {
        flipped[0].textContent = '?'; flipped[0].classList.remove('flipped');
        flipped[1].textContent = '?'; flipped[1].classList.remove('flipped');
        flipped = []; lock = false;
      }, 800);
    }
  }
}

initGame();
</script>
</body>
</html>
