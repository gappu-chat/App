<!DOCTYPE html>
<html lang="hi" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snakes & Ladders</title>
<style>
body{margin:0;background:#0d2b2a;color:#fff;font-family:Georgia,serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;}
.header{width:100%;max-width:500px;display:flex;justify-content:space-between;padding:10px;box-sizing:border-box;background:#0a2322;border-bottom:2px solid #e0b04a;}
a{color:#e0b04a;text-decoration:none;font-weight:bold;}
.container{width:100%;max-width:500px;padding:16px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;}
input,button{font:inherit;border-radius:12px;border:2px solid #e0b04a;padding:12px;width:100%;margin-bottom:10px;}
input{background:#14504d;color:#fff;}
button{background:#e0b04a;color:#1b1b14;font-weight:bold;cursor:pointer;}
button.alt{background:transparent;color:#e0b04a;}
button:disabled{opacity:0.5;}
.hidden{display:none!important;}
.board{width:100%;aspect-ratio:1;background:#14504d;border:4px solid #2a7a73;border-radius:16px;position:relative;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);gap:1px;padding:2px;box-sizing:border-box;}
.cell{background:#1d6b66;position:relative;display:flex;align-items:center;justify-content:center;font-size:10px;color:#9fc2bd;flex-direction:column;}
.cell.dark{background:#14504d;}
.cell .icon{font-size:16px;line-height:1;}
.player{width:80%;height:80%;border-radius:50%;position:absolute;display:flex;align-items:center;justify-content:center;font-weight:bold;box-shadow:0 2px 5px #0008;border:1px solid #fff;font-size:8px;transition:all 0.3s;z-index:2;}
.p1{background:#e74c3c;} .p2{background:#2ecc71;} .p3{background:#f1c40f;color:#000;} .p4{background:#3498db;}
.dice-box{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:20px;background:#0a2322;padding:10px;border-radius:12px;}
.dice{font-size:3rem;font-weight:bold;color:#e0b04a;width:60px;text-align:center;}
.chat-box{width:100%;height:120px;overflow-y:auto;background:#0a2322;border:1px solid #2a7a73;border-radius:8px;padding:8px;margin-top:10px;font-size:0.85rem;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;}
.chat-msg b{color:#e0b04a;}
.chat-input{display:flex;gap:8px;margin-top:8px;}
.chat-input input{margin:0;flex:1;padding:8px;}
.chat-input button{width:auto;margin:0;padding:8px 16px;}
#timerTxt{font-weight:bold;color:#e74c3c;font-size:1.2rem;}
#topProfiles{display:flex;gap:8px;width:100%;margin-bottom:15px;justify-content:center;}
</style>
</head>
<body>
<div class="header">
  <a href="index.html">← Chat par wapas</a>
  <div style="font-weight:bold;color:#e0b04a;">Snakes & Ladders</div>
</div>

<div class="container" id="loading">
  <h2>Loading...</h2>
</div>

<div class="container hidden" id="lobby">
  <h2>Snakes & Ladders</h2>
  <p style="text-align:center;font-size:0.9rem;opacity:0.8">Kisi bhi user se connect hone ke liye Global Play dabao, ya dosto ke saath khelne ke liye naya room banao.</p>
  <button id="globalBtn" style="background:#2ecc71; border-color:#2ecc71; color:#fff; font-size:1.1rem; padding:15px;">🌍 Play Global</button>
  <div style="width:100%; text-align:center; margin:10px 0; color:#e0b04a;">- YA -</div>
  <button id="createBtn">➕ Private Room Banao</button>
  <input id="joinId" placeholder="Room ID daalo" maxlength="6" autocapitalize="characters">
  <button id="joinBtn" class="alt">Room Join Karo</button>
  <div id="lobbyMsg" style="color:#e0b04a;text-align:center;margin-top:10px;"></div>
</div>

<div class="container hidden" id="gameRoom">
  <div style="display:flex;justify-content:space-between;width:100%;align-items:center;margin-bottom:10px;">
    <h3 style="margin:0;color:#e0b04a;" id="gidTxt">Room: </h3>
    <div style="display:flex;align-items:center;gap:10px;">
       <span id="turnTxt" style="font-weight:bold;color:#2ecc71;">Wait...</span>
       <span id="timerTxt"></span>
    </div>
  </div>
  
  <div id="topProfiles"></div>
  <div class="board" id="board"></div>

  <div class="dice-box">
    <div style="font-size:0.9rem;" id="playersList"></div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="dice" id="dice">🎲</div>
      <button id="rollBtn" style="width:auto;margin:0;padding:10px 20px;">Roll</button>
    </div>
  </div>

  <div class="chat-box" id="chatBox"></div>
  <div class="chat-input">
    <input id="chatIn" placeholder="Message likho...">
    <button id="chatBtn">➤</button>
  </div>
</div>

<div id="profModal" class="hidden" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#0008;z-index:100;display:flex;align-items:center;justify-content:center;">
  <div style="background:#0d2b2a;padding:20px;border-radius:16px;border:2px solid #e0b04a;width:80%;max-width:300px;text-align:center;">
     <div id="pmAv" style="width:80px;height:80px;border-radius:50%;background:#e0b04a;margin:0 auto 10px;background-size:cover;display:flex;align-items:center;justify-content:center;font-size:2rem;color:#1b1b14;font-weight:bold;"></div>
     <h3 id="pmName" style="margin:5px 0;"></h3>
     <p id="pmId" style="color:#9fc2bd;margin-bottom:20px;font-size:1.1rem;">@...</p>
     <button id="pmMsgBtn" style="background:#2ecc71;border-color:#2ecc71;color:#fff;margin-bottom:10px;">💬 Message Karo</button>
     <button id="pmClose" class="alt" style="margin:0;">Close</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDFmI6YZIp7qKbgrgdr8VPLr1xkOXbGHb0",
  authDomain: "auction-game-80e14.firebaseapp.com",
  databaseURL: "https://auction-game-80e14-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "auction-game-80e14",
  appId: "1:984901985057:web:8a5d78169ad75f72341460"
};
firebase.initializeApp(firebaseConfig);
firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);
const auth = firebase.auth(), db = firebase.database();
const $ = id => document.getElementById(id);

let me = null, prof = null, currentGid = null, gameRef = null, gameData = null;
let chatRef = null;
let turnInterval = null;

// Snakes and Ladders mapping
const snakes = {16:6, 47:26, 49:11, 56:53, 62:19, 64:60, 87:24, 93:73, 95:75, 98:78};
const ladders = {1:38, 4:14, 9:31, 21:42, 28:84, 36:44, 51:67, 71:91, 80:100};

auth.onAuthStateChanged(async user => {
  if (!user) { window.location.href = 'index.html'; return; }
  me = user;
  const s = await db.ref('profiles/' + me.uid).once('value');
  if (s.exists()) {
    prof = s.val();
    $('loading').classList.add('hidden');
    $('lobby').classList.remove('hidden');
  } else { window.location.href = 'index.html'; }
});

function joinRoom(gid) {
  currentGid = gid;
  gameRef = db.ref('sl_games/' + gid);
  
  gameRef.once('value').then(snap => {
    if(!snap.exists()) { $('lobbyMsg').textContent = 'Room nahi mila!'; return; }
    const g = snap.val();
    
    if(g.status === 'finished') { $('lobbyMsg').textContent = 'Ye game khatam ho chuka hai!'; return; }
    
    const players = g.players || {};
    const pCount = Object.keys(players).length;
    
    if(!players[me.uid] && pCount >= 4) { $('lobbyMsg').textContent = 'Room full hai (4 players)!'; return; }
    
    const updates = {};
    if(!players[me.uid]) {
       const colors = ['p1','p2','p3','p4'];
       let myCol = colors[pCount];
       updates['players/' + me.uid] = { name: prof.name, pos: 0, color: myCol };
       
       if (pCount + 1 === 4) {
           updates.status = 'playing';
           updates.turn = Object.keys(players)[0] || me.uid;
       }
    } else if (pCount === 4 && g.status === 'waiting') {
       updates.status = 'playing';
       updates.turn = g.turn || Object.keys(players)[0];
    }
    
    if(Object.keys(updates).length > 0) {
        gameRef.update(updates).then(() => enterGame());
    } else {
        enterGame();
    }
  });
}

$('createBtn').onclick = async () => {
  if(!prof) return;
  const gid = Math.floor(10000 + Math.random() * 90000).toString();
  await db.ref('sl_games/' + gid).set({
    status: 'waiting',
    admin: me.uid,
    created: Date.now(),
    players: { [me.uid]: { name: prof.name, pos: 0, color: 'p1' } },
    turn: me.uid,
    dice: 0
  });
  joinRoom(gid);
};

$('joinBtn').onclick = () => {
  const gid = $('joinId').value.trim();
  if(!gid) return;
  joinRoom(gid);
};

$('globalBtn').onclick = async () => {
  if(!prof) return;
  $('globalBtn').textContent = 'Searching...';
  $('globalBtn').disabled = true;
  
  try {
    const snap = await db.ref('sl_games').orderByChild('status').equalTo('waiting').limitToFirst(10).once('value');
    let foundGid = null;
    
    if(snap.exists()) {
      snap.forEach(child => {
        if(!foundGid) {
          const g = child.val();
          const isOld = (Date.now() - g.created) > 1800000; // 30 mins expiry
          const pCount = Object.keys(g.players || {}).length;
          if(pCount < 4 && !isOld) foundGid = child.key;
        }
      });
    }
    
    if(foundGid) {
      $('globalBtn').textContent = 'Joining...';
      joinRoom(foundGid);
    } else {
      $('globalBtn').textContent = 'Creating room...';
      const gid = Math.floor(10000 + Math.random() * 90000).toString();
      await db.ref('sl_games/' + gid).set({
        status: 'waiting',
        admin: me.uid,
        created: Date.now(),
        players: { [me.uid]: { name: prof.name, pos: 0, color: 'p1' } },
        turn: me.uid,
        dice: 0
      });
      joinRoom(gid);
    }
  } catch(e) {
    $('lobbyMsg').textContent = 'Error aagaya, wapas try karo.';
    $('globalBtn').textContent = '🌍 Play Global';
    $('globalBtn').disabled = false;
  }
};

function enterGame() {
  $('lobby').classList.add('hidden');
  $('gameRoom').classList.remove('hidden');
  $('gidTxt').textContent = 'Room: ' + currentGid;
  
  gameRef.on('value', snap => {
    gameData = snap.val();
    if(!gameData) return;
    renderBoard();
    updateTurn();
    renderTopProfiles();
  });
  
  chatRef = db.ref('sl_games/' + currentGid + '/chat');
  chatRef.limitToLast(20).on('child_added', s => {
    const m = s.val();
    const box = $('chatBox');
    const d = document.createElement('div'); d.className = 'chat-msg';
    const safeName = m.name.replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const safeText = m.text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
    d.innerHTML = `<b>${safeName}:</b> ${safeText}`;
    box.appendChild(d); box.scrollTop = box.scrollHeight;
  });
}

function renderTopProfiles() {
  const top = $('topProfiles');
  top.innerHTML = '';
  const players = gameData.players || {};
  const pCount = Object.keys(players).length;
  const colorMap = { 'p1': '#e74c3c', 'p2': '#2ecc71', 'p3': '#f1c40f', 'p4': '#3498db' };
  
  for (let i=0; i<4; i++) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;padding:5px;border-radius:8px;min-width:60px;';
    
    if (i < pCount) {
      const uid = Object.keys(players)[i];
      const p = players[uid];
      wrap.style.background = 'rgba(255,255,255,0.05)';
      wrap.style.border = `2px solid ${colorMap[p.color] || '#e0b04a'}`;
      wrap.style.cursor = 'pointer';
      
      const av = document.createElement('div');
      av.style.cssText = `width:35px;height:35px;border-radius:50%;background:${colorMap[p.color]};color:#1b1b14;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;`;
      av.textContent = p.name[0].toUpperCase();
      
      if (uid === gameData.turn && gameData.status === 'playing') {
          av.style.boxShadow = '0 0 10px #fff';
          av.style.border = '2px solid #fff';
      }
      
      db.ref('profiles/' + uid).once('value').then(s => {
          const pr = s.val();
          if(pr && pr.photo) { av.style.backgroundImage = `url(${pr.photo})`; av.style.backgroundSize = 'cover'; av.textContent = ''; }
      });
      
      const nm = document.createElement('div');
      nm.textContent = p.name.split(' ')[0]; 
      nm.style.cssText = 'font-size:10px;margin-top:4px;color:#fff;font-weight:bold;';
      
      wrap.appendChild(av); wrap.appendChild(nm);
      wrap.onclick = () => openProfileModal(uid, p.name);
    } else {
      wrap.style.background = 'rgba(255,255,255,0.02)';
      wrap.style.border = '2px dashed #2a7a73';
      
      const av = document.createElement('div');
      av.style.cssText = 'width:35px;height:35px;border-radius:50%;background:#14504d;display:flex;align-items:center;justify-content:center;color:#2a7a73;font-size:20px;';
      av.textContent = '?';
      
      const nm = document.createElement('div');
      nm.textContent = 'Empty'; nm.style.cssText = 'font-size:10px;margin-top:4px;color:#2a7a73;';
      
      wrap.appendChild(av); wrap.appendChild(nm);
    }
    top.appendChild(wrap);
  }
}

function openProfileModal(uid, name) {
   if(uid === me.uid) return; 
   db.ref('profiles/' + uid).once('value').then(s => {
       const p = s.val();
       const un = p ? p.username : 'unknown';
       $('pmName').textContent = name; $('pmId').textContent = '@' + un;
       if(p && p.photo) { $('pmAv').style.backgroundImage = `url(${p.photo})`; $('pmAv').textContent = ''; } 
       else { $('pmAv').style.backgroundImage = 'none'; $('pmAv').textContent = name[0].toUpperCase(); }
       $('pmMsgBtn').onclick = () => { window.location.href = 'index.html?chat=' + un; };
       $('profModal').classList.remove('hidden');
   });
}
$('pmClose').onclick = () => $('profModal').classList.add('hidden');

function renderBoard() {
  const board = $('board');
  board.innerHTML = '';
  
  for(let i=0; i<10; i++) {
    for(let j=0; j<10; j++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      let num;
      if (i % 2 === 0) { num = 100 - (i * 10) - j; } 
      else { num = 100 - (i * 10) - (9 - j); }
      
      // Add icons for snakes and ladders
      let icon = '';
      if (snakes[num]) icon = '🐍';
      if (ladders[num]) icon = '🪜';
      
      cell.innerHTML = `<span>${num}</span>${icon ? `<span class="icon">${icon}</span>` : ''}`;
      if (num % 2 === 0) cell.classList.add('dark');
      cell.id = 'cell-' + num;
      board.appendChild(cell);
    }
  }

  const players = gameData.players || {};
  let pNames = [];
  Object.keys(players).forEach(uid => {
    const p = players[uid];
    pNames.push(p.name);
    if (p.pos === 0) return;
    
    const targetCell = $('cell-' + p.pos);
    if (targetCell) {
      const el = document.createElement('div');
      el.className = 'player ' + p.color;
      el.textContent = p.name[0].toUpperCase();
      targetCell.appendChild(el);
    }
  });
  $('playersList').innerHTML = pNames.join(', ');
}

function updateTurn() {
  const players = gameData.players || {};
  const pCount = Object.keys(players).length;
  
  if (gameData.status !== 'playing') {
     $('turnTxt').textContent = `Wait... (${pCount}/4 joined)`;
     $('turnTxt').style.color = "#e0b04a";
     $('rollBtn').disabled = true;
     clearInterval(turnInterval);
     $('timerTxt').textContent = '';
     return;
  }

  const turnUid = gameData.turn;
  const pInfo = players[turnUid];
  const winner = Object.values(players).find(p => p.pos === 100);
  
  if (winner) {
    $('turnTxt').textContent = "🏆 " + winner.name + " Jeet Gaya!";
    $('turnTxt').style.color = "#2ecc71";
    $('rollBtn').disabled = true;
    clearInterval(turnInterval);
    $('timerTxt').textContent = '';
    return;
  }
  
  if (turnUid === me.uid) {
    $('turnTxt').textContent = "Tumhari baari!";
    $('turnTxt').style.color = "#2ecc71";
    $('rollBtn').disabled = false;
    startTimer();
  } else {
    $('turnTxt').textContent = (pInfo ? pInfo.name : 'Kisi aur') + " ki baari";
    $('turnTxt').style.color = "#e74c3c";
    $('rollBtn').disabled = true;
    clearInterval(turnInterval);
    $('timerTxt').textContent = ''; 
  }
}

function startTimer() {
  clearInterval(turnInterval);
  let timeLeft = 10;
  $('timerTxt').textContent = `(${timeLeft}s)`;
  turnInterval = setInterval(() => {
    timeLeft--;
    $('timerTxt').textContent = `(${timeLeft}s)`;
    if(timeLeft <= 0) {
      clearInterval(turnInterval);
      autoSkipTurn();
    }
  }, 1000);
}

async function autoSkipTurn() {
  if (!gameData || gameData.turn !== me.uid) return;
  const updates = {};
  updates.turn = getNextTurn(true);
  updates.dice = 0;
  await gameRef.update(updates);
}

$('rollBtn').onclick = async () => {
  if (!gameData || gameData.turn !== me.uid || gameData.status !== 'playing') return;
  $('rollBtn').disabled = true;
  clearInterval(turnInterval);
  $('timerTxt').textContent = '';
  
  const dice = Math.floor(Math.random() * 6) + 1;
  $('dice').textContent = dice;
  
  const players = gameData.players;
  let myPos = players[me.uid].pos;
  let newPos = myPos + dice;
  
  if (newPos > 100) newPos = 100;
  
  if (snakes[newPos]) newPos = snakes[newPos];
  if (ladders[newPos]) newPos = ladders[newPos];
  
  const updates = {};
  updates['players/' + me.uid + '/pos'] = newPos;
  
  if (newPos === 100) {
     updates.status = 'finished';
     updates.winner = me.uid;
     updates.finishedAt = Date.now();
     db.ref('sl_history').push({
        gid: currentGid,
        players: Object.values(players).map(p => p.name),
        winner: prof.name,
        ts: Date.now()
     });
  } else {
     if (dice === 6) {
         updates.turn = me.uid; 
     } else {
         updates.turn = getNextTurn();
     }
  }
  updates.dice = dice;
  
  await gameRef.update(updates);
};

function getNextTurn(force = false) {
  const uids = Object.keys(gameData.players);
  if (uids.length === 0) return null;
  const curr = uids.indexOf(gameData.turn);
  return uids[(curr + 1) % uids.length];
}

$('chatBtn').onclick = () => {
  const text = $('chatIn').value.trim();
  if(!text) return;
  $('chatIn').value = '';
  chatRef.push({ name: prof.name, text, ts: Date.now() });
};
</script>
</body>
</html>
