<!DOCTYPE html>
<html lang="hi" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Battle</title>
<style>
body{margin:0;background:#0d2b2a;color:#fff;font-family:Georgia,serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;}
.header{width:100%;max-width:500px;display:flex;justify-content:space-between;padding:10px;box-sizing:border-box;background:#0a2322;border-bottom:2px solid #e0b04a;}
a{color:#e0b04a;text-decoration:none;font-weight:bold;}
.container{width:100%;max-width:500px;padding:16px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;}
input,button{font:inherit;border-radius:12px;border:2px solid #e0b04a;padding:12px;width:100%;margin-bottom:10px;}
input{background:#14504d;color:#fff;}
button{background:#e0b04a;color:#1b1b14;font-weight:bold;cursor:pointer;}
button.alt{background:transparent;color:#e0b04a;}
button:disabled{opacity:0.5;}
.hidden{display:none!important;}

/* Game UI */
#topProfiles{display:flex;gap:8px;width:100%;margin-bottom:15px;justify-content:center;}
.q-box{width:100%;background:#14504d;border:2px solid #2a7a73;border-radius:12px;padding:20px;text-align:center;margin-bottom:15px;font-size:1.2rem;font-weight:bold;}
.opt-btn{background:#1d6b66;color:#fff;border:2px solid #2a7a73;padding:15px;text-align:left;font-size:1rem;margin-bottom:10px;transition:0.2s;}
.opt-btn.correct{background:#2ecc71 !important;border-color:#2ecc71 !important;color:#000;}
.opt-btn.wrong{background:#e74c3c !important;border-color:#e74c3c !important;color:#fff;}
.opt-btn:disabled{opacity:0.8;}

#timerTxt{font-weight:bold;color:#e74c3c;font-size:1.2rem;}
.chat-box{width:100%;height:120px;overflow-y:auto;background:#0a2322;border:1px solid #2a7a73;border-radius:8px;padding:8px;margin-top:10px;font-size:0.85rem;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;}
.chat-msg b{color:#e0b04a;}
.chat-input{display:flex;gap:8px;margin-top:8px;width:100%;}
.chat-input input{margin:0;flex:1;padding:8px;}
.chat-input button{width:auto;margin:0;padding:8px 16px;}
</style>
</head>
<body>
<div class="header">
  <a href="index.html">← Chat par wapas</a>
  <div style="font-weight:bold;color:#e0b04a;">Quiz Battle</div>
</div>

<div class="container" id="loading">
  <h2>Loading...</h2>
</div>

<div class="container hidden" id="lobby">
  <h2>Quiz Battle</h2>
  <p style="text-align:center;font-size:0.9rem;opacity:0.8">Dosto ke saath khelne ke liye Global Play dabao, ya naya room banao. (Min 2 Players)</p>
  <button id="globalBtn" style="background:#2ecc71; border-color:#2ecc71; color:#fff; font-size:1.1rem; padding:15px;">🌍 Play Global</button>
  <div style="width:100%; text-align:center; margin:10px 0; color:#e0b04a;">- YA -</div>
  <button id="createBtn">➕ Private Room Banao</button>
  <input id="joinId" placeholder="Room ID daalo" maxlength="6" autocapitalize="characters">
  <button id="joinBtn" class="alt">Room Join Karo</button>
  <div id="lobbyMsg" style="color:#e0b04a;text-align:center;margin-top:10px;"></div>
</div>

<div class="container hidden" id="gameRoom">
  <div style="display:flex;justify-content:space-between;width:100%;align-items:center;margin-bottom:10px;">
    <h3 style="margin:0;color:#e0b04a;" id="gidTxt">Room: </h3>
    <div style="display:flex;align-items:center;gap:10px;">
       <span id="qNumTxt" style="font-size:0.9rem;color:#9fc2bd;"></span>
       <span id="timerTxt"></span>
    </div>
  </div>
  
  <div id="topProfiles"></div>
  
  <div class="q-box" id="questionText">Wait...</div>
  <div id="optionsBox" style="width:100%;"></div>

  <div id="hostControls" class="hidden" style="width:100%; margin-bottom:10px;">
     <button id="startBtn" style="background:#2ecc71; border-color:#2ecc71; color:#fff;">▶ Start Quiz (Admin)</button>
     <button id="nextBtn" class="hidden" style="background:#3498db; border-color:#3498db; color:#fff;">➡ Next Question</button>
  </div>

  <div class="chat-box" id="chatBox"></div>
  <div class="chat-input">
    <input id="chatIn" placeholder="Message likho...">
    <button id="chatBtn">➤</button>
  </div>
</div>

<!-- Profile Popup Modal -->
<div id="profModal" class="hidden" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#0008;z-index:100;display:flex;align-items:center;justify-content:center;">
  <div style="background:#0d2b2a;padding:20px;border-radius:16px;border:2px solid #e0b04a;width:80%;max-width:300px;text-align:center;">
     <div id="pmAv" style="width:80px;height:80px;border-radius:50%;background:#e0b04a;margin:0 auto 10px;background-size:cover;display:flex;align-items:center;justify-content:center;font-size:2rem;color:#1b1b14;font-weight:bold;"></div>
     <h3 id="pmName" style="margin:5px 0;"></h3>
     <p id="pmId" style="color:#9fc2bd;margin-bottom:20px;font-size:1.1rem;">@...</p>
     <button id="pmMsgBtn" style="background:#2ecc71;border-color:#2ecc71;color:#fff;margin-bottom:10px;">💬 Message Karo</button>
     <button id="pmClose" class="alt" style="margin:0;">Close</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDFmI6YZIp7qKbgrgdr8VPLr1xkOXbGHb0",
  authDomain: "auction-game-80e14.firebaseapp.com",
  databaseURL: "https://auction-game-80e14-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "auction-game-80e14",
  appId: "1:984901985057:web:8a5d78169ad75f72341460"
};
firebase.initializeApp(firebaseConfig);
firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);
const auth = firebase.auth(), db = firebase.database();
const $ = id => document.getElementById(id);

let me = null, prof = null, currentGid = null, gameRef = null, gameData = null;
let chatRef = null;
let turnInterval = null;

// Quiz Data (5 Questions)
const QUIZ_DATA = [
  { q: "Bharat ki rajdhani kya hai?", o: ["Mumbai", "Delhi", "Kolkata", "Chennai"], a: 1 },
  { q: "1 + 1 + 2 x 0 = ?", o: ["4", "2", "0", "1"], a: 1 },
  { q: "Saurmandal ka sabse bada grah (planet) kaunsa hai?", o: ["Prithvi", "Shani", "Guru (Jupiter)", "Mangal"], a: 2 },
  { q: "IPL me abhi kitni team hoti hain?", o: ["8", "10", "12", "14"], a: 1 },
  { q: "Chai kis patte se banti hai?", o: ["Neem", "Peepal", "Camellia sinensis", "Tulsi"], a: 2 }
];

auth.onAuthStateChanged(async user => {
  if (!user) { window.location.href = 'index.html'; return; }
  me = user;
  const s = await db.ref('profiles/' + me.uid).once('value');
  if (s.exists()) {
    prof = s.val();
    $('loading').classList.add('hidden');
    $('lobby').classList.remove('hidden');
  } else { window.location.href = 'index.html'; }
});

function joinRoom(gid) {
  currentGid = gid;
  gameRef = db.ref('quiz_games/' + gid);
  
  gameRef.once('value').then(snap => {
    if(!snap.exists()) { $('lobbyMsg').textContent = 'Room nahi mila!'; return; }
    const g = snap.val();
    
    if(g.status !== 'waiting' && g.status !== 'playing') { $('lobbyMsg').textContent = 'Ye game khatam ho chuka hai!'; return; }
    
    const players = g.players || {};
    const pCount = Object.keys(players).length;
    
    if(!players[me.uid] && pCount >= 4) { $('lobbyMsg').textContent = 'Room full hai (4 players)!'; return; }
    
    if(!players[me.uid]) {
       const colors = ['p1','p2','p3','p4'];
       gameRef.child('players/' + me.uid).set({ name: prof.name, score: 0, color: colors[pCount] });
    }
    enterGame();
  });
}

$('createBtn').onclick = async () => {
  if(!prof) return;
  const gid = Math.floor(10000 + Math.random() * 90000).toString();
  await db.ref('quiz_games/' + gid).set({
    status: 'waiting',
    admin: me.uid,
    created: Date.now(),
    players: { [me.uid]: { name: prof.name, score: 0, color: 'p1' } },
    qIndex: 0,
    answers: {}
  });
  joinRoom(gid);
};

$('joinBtn').onclick = () => {
  const gid = $('joinId').value.trim();
  if(!gid) return;
  joinRoom(gid);
};

$('globalBtn').onclick = async () => {
  if(!prof) return;
  $('globalBtn').textContent = 'Searching...';
  $('globalBtn').disabled = true;
  
  try {
    const snap = await db.ref('quiz_games').orderByChild('status').equalTo('waiting').limitToFirst(5).once('value');
    let foundGid = null;
    if(snap.exists()) {
      snap.forEach(child => {
        if(!foundGid) {
          const g = child.val();
          if(Object.keys(g.players || {}).length < 4) foundGid = child.key;
        }
      });
    }
    
    if(foundGid) {
      $('globalBtn').textContent = 'Joining...';
      joinRoom(foundGid);
    } else {
      $('globalBtn').textContent = 'Creating room...';
      const gid = Math.floor(10000 + Math.random() * 90000).toString();
      await db.ref('quiz_games/' + gid).set({
        status: 'waiting',
        admin: me.uid,
        created: Date.now(),
        players: { [me.uid]: { name: prof.name, score: 0, color: 'p1' } },
        qIndex: 0,
        answers: {}
      });
      joinRoom(gid);
    }
  } catch(e) {
    $('lobbyMsg').textContent = 'Error aagaya, wapas try karo.';
    $('globalBtn').textContent = '🌍 Play Global';
    $('globalBtn').disabled = false;
  }
};

function enterGame() {
  $('lobby').classList.add('hidden');
  $('gameRoom').classList.remove('hidden');
  $('gidTxt').textContent = 'Room: ' + currentGid;
  
  gameRef.on('value', snap => {
    gameData = snap.val();
    if(!gameData) return;
    renderGame();
  });
  
  chatRef = db.ref('quiz_games/' + currentGid + '/chat');
  chatRef.limitToLast(20).on('child_added', s => {
    const m = s.val();
    const box = $('chatBox');
    const d = document.createElement('div'); d.className = 'chat-msg';
    const safeName = m.name.replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const safeText = m.text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
    d.innerHTML = `<b>${safeName}:</b> ${safeText}`;
    box.appendChild(d); box.scrollTop = box.scrollHeight;
  });
}

function renderGame() {
  renderTopProfiles();
  const qIndex = gameData.qIndex || 0;
  const status = gameData.status;
  
  if (me.uid === gameData.admin && status === 'waiting') {
      $('hostControls').classList.remove('hidden');
      $('startBtn').classList.remove('hidden');
      $('nextBtn').classList.add('hidden');
  } else if (me.uid === gameData.admin && status === 'playing') {
      $('hostControls').classList.remove('hidden');
      $('startBtn').classList.add('hidden');
      // Only show Next if timer is done or manually pushing
      $('nextBtn').classList.add('hidden'); 
  } else {
      $('hostControls').classList.add('hidden');
  }

  if (status === 'waiting') {
     $('questionText').textContent = "Wait for admin to start...";
     $('optionsBox').innerHTML = '';
     $('timerTxt').textContent = '';
  } else if (status === 'playing') {
     const qStart = gameData.qStart || Date.now();
     const timePassed = Date.now() - qStart;
     if(timePassed > 15000 && me.uid === gameData.admin) {
         $('nextBtn').click(); // Auto next if 15s over
     }
     let tLeft = 15 - Math.floor(timePassed / 1000);
     $('timerTxt').textContent = tLeft > 0 ? `(${tLeft}s)` : `(0s)`;
     
     const qData = QUIZ_DATA[qIndex];
     $('qNumTxt').textContent = `Q: ${qIndex + 1}/${QUIZ_DATA.length}`;
     $('questionText').textContent = qData.q;
     
     // Render options
     const box = $('optionsBox');
     box.innerHTML = '';
     qData.o.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.textContent = opt;
        btn.onclick = () => submitAnswer(idx);
        
        // Highlight if already answered
        if (gameData.answers && gameData.answers[me.uid] !== undefined) {
            btn.disabled = true;
            if (gameData.answers[me.uid] === qData.a) btn.classList.add('correct');
            else if (gameData.answers[me.uid] === idx) btn.classList.add('wrong');
        }
        box.appendChild(btn);
     });
     
     // Admin timer logic
     if (me.uid === gameData.admin) {
         startAdminTimer();
     }
  } else if (status === 'finished') {
     $('timerTxt').textContent = '';
     const winner = Object.keys(gameData.players).reduce((a, b) => gameData.players[a].score > gameData.players[b].score ? a : b);
     $('questionText').textContent = "🏆 " + gameData.players[winner].name + " Jeeta!";
     $('optionsBox').innerHTML = '';
     $('hostControls').classList.add('hidden');
  }
}

function renderTopProfiles() {
  const top = $('topProfiles');
  top.innerHTML = '';
  const players = gameData.players || {};
  const pCount = Object.keys(players).length;
  const colorMap = { 'p1': '#e74c3c', 'p2': '#2ecc71', 'p3': '#f1c40f', 'p4': '#3498db' };
  
  for (let i=0; i<4; i++) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;padding:5px;border-radius:8px;min-width:60px;';
    
    if (i < pCount) {
      const uid = Object.keys(players)[i];
      const p = players[uid];
      wrap.style.background = 'rgba(255,255,255,0.05)';
      wrap.style.border = `2px solid ${colorMap[p.color] || '#e0b04a'}`;
      
      const av = document.createElement('div');
      av.style.cssText = `width:35px;height:35px;border-radius:50%;background:${colorMap[p.color]};color:#1b1b14;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;`;
      av.textContent = p.name[0].toUpperCase();
      
      db.ref('profiles/' + uid).once('value').then(s => {
          const pr = s.val();
          if(pr && pr.photo) { av.style.backgroundImage = `url(${pr.photo})`; av.style.backgroundSize = 'cover'; av.textContent = ''; }
      });
      
      const nm = document.createElement('div');
      nm.textContent = p.name.split(' ')[0] + ' (' + p.score + ')'; 
      nm.style.cssText = 'font-size:10px;margin-top:4px;color:#fff;font-weight:bold;';
      
      wrap.appendChild(av); wrap.appendChild(nm);
      wrap.onclick = () => openProfileModal(uid, p.name);
    } else {
      wrap.style.background = 'rgba(255,255,255,0.02)';
      wrap.style.border = '2px dashed #2a7a73';
      const av = document.createElement('div');
      av.style.cssText = 'width:35px;height:35px;border-radius:50%;background:#14504d;display:flex;align-items:center;justify-content:center;color:#2a7a73;font-size:20px;';
      av.textContent = '?';
      const nm = document.createElement('div');
      nm.textContent = 'Empty'; nm.style.cssText = 'font-size:10px;margin-top:4px;color:#2a7a73;';
      wrap.appendChild(av); wrap.appendChild(nm);
    }
    top.appendChild(wrap);
  }
}

function openProfileModal(uid, name) {
   if(uid === me.uid) return;
   db.ref('profiles/' + uid).once('value').then(s => {
       const p = s.val();
       const un = p ? p.username : 'unknown';
       $('pmName').textContent = name; $('pmId').textContent = '@' + un;
       if(p && p.photo) { $('pmAv').style.backgroundImage = `url(${p.photo})`; $('pmAv').textContent = ''; } 
       else { $('pmAv').style.backgroundImage = 'none'; $('pmAv').textContent = name[0].toUpperCase(); }
       $('pmMsgBtn').onclick = () => { window.location.href = 'index.html?chat=' + un; };
       $('profModal').classList.remove('hidden');
   });
}
$('pmClose').onclick = () => $('profModal').classList.add('hidden');

// Admin Controls
$('startBtn').onclick = async () => {
   const pCount = Object.keys(gameData.players || {}).length;
   if(pCount < 2) { alert("Kam se kam 2 players chahiye!"); return; }
   await gameRef.update({ status: 'playing', qIndex: 0, answers: {}, qStart: Date.now() });
};

$('nextBtn').onclick = async () => {
   let nextQ = gameData.qIndex + 1;
   if (nextQ >= QUIZ_DATA.length) {
       await gameRef.update({ status: 'finished' });
       
       // Find winner and give rewards
       let winnerUid = null;
       let maxScore = -1;
       for (const uid in gameData.players) {
           if (gameData.players[uid].score > maxScore) {
               maxScore = gameData.players[uid].score;
               winnerUid = uid;
           }
       }
       if (winnerUid) {
           db.ref('profiles/' + winnerUid + '/coins').set(firebase.database.ServerValue.increment(100));
           db.ref('profiles/' + winnerUid + '/gamesWon').set(firebase.database.ServerValue.increment(1));
       }
       
       // Save history
       db.ref('quiz_history').push({
          gid: currentGid,
          players: Object.values(gameData.players).map(p => p.name),
          scores: Object.values(gameData.players).map(p => p.score),
          ts: Date.now()
       });
   } else {
       await gameRef.update({ qIndex: nextQ, answers: {}, qStart: Date.now() });
   }
};

// Timer Logic (Admin controls the clock to prevent cheating)
function startAdminTimer() {
  clearInterval(turnInterval);
  let timeLeft = 15;
  $('timerTxt').textContent = `(${timeLeft}s)`;
  
  // Check if all players already answered
  const pCount = Object.keys(gameData.players || {}).length;
  const aCount = Object.keys(gameData.answers || {}).length;
  if (aCount >= pCount) {
      $('nextBtn').classList.remove('hidden');
      return; // Stop timer if all answered
  }

  turnInterval = setInterval(() => {
    timeLeft--;
    $('timerTxt').textContent = `(${timeLeft}s)`;
    if(timeLeft <= 0) {
      clearInterval(turnInterval);
      $('nextBtn').classList.remove('hidden');
    }
  }, 1000);
}

async function submitAnswer(optIdx) {
  if (gameData.answers && gameData.answers[me.uid] !== undefined) return; // Already answered
  
  const qData = QUIZ_DATA[gameData.qIndex];
  const updates = {};
  updates['answers/' + me.uid] = optIdx;
  
  if (optIdx === qData.a) {
      // Correct answer, give 10 points
      const currentScore = gameData.players[me.uid].score || 0;
      updates['players/' + me.uid + '/score'] = currentScore + 10;
  }
  
  await gameRef.update(updates);
}

$('chatBtn').onclick = () => {
  const text = $('chatIn').value.trim();
  if(!text) return;
  $('chatIn').value = '';
  chatRef.push({ name: prof.name, text, ts: Date.now() });
};
</script>
</body>
</html>
